<form [formGroup]="form">
    <div class="button">
        <button type="button" class="btn" (click)="setGenre('1')"
            [class.active]="form.get('genre')?.value === '1'">Monsieur</button>
        <button class="btn" type="button" (click)="setGenre('2')"
            [class.active]="form.get('genre')?.value === '2'">Madame</button>
        <button class="btn" type="button" (click)="setGenre('3')"
            [class.active]="form.get('genre')?.value === '3'">Non-genré</button>
    </div>
    <div class="trait-vertical"></div>
    <div class="bloc-input">
        <label for="pseudo">Pseudo</label>
        <input type="text" formControlName="pseudo">
    </div>
    <div class="trait-vertical"></div>
    <div class="bloc-input">
        <label for="mail">Email</label>
        <input type="text" formControlName="email">
    </div>
    
    <div class="container-modif">
        <div class="trait-vertical"></div>
        <button type="button" (click)="modifierUtilisateur()">
            Enregistrer les modifications
        </button>
    </div>

</form>
