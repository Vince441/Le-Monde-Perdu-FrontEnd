<div class="main">
    <form [formGroup]="form">
        <div class="form-input">
            <Label>Nom du Dinosaure</Label>

            <input formControlName="nom">
        </div>

        <div class="form-input">
            <Label>Type du Dinosaure</Label>
            <select formControlName="type">
                <option value="">--Veuillez choisir une option--</option>
                @for(t of typesDinosaures; track $index){
                <option [value]="t.id">{{t.type}}</option>
                }
            </select>
        </div>

        <div class="form-input">
            <Label>Période du Dinosaure</Label>

            <select formControlName="periode">
                <option value="">--Veuillez choisir une option--</option>
                @for(p of periodesDinosaures; track $index){
                <option [value]="p.id">{{p.periode}}</option>
                }
            </select>

        </div>

        <div class="form-input">
            <label>Poid du Dinoosaure</label>
            <input formControlName="poid">
        </div>

        <div class="form-input">
            <label>Taille du Dinosaure</label>
            <input formControlName="taille">
        </div>

        <div class="form-input">
            <label>Description du Dinosaure</label>
            <textarea formControlName="description" maxlength="255"></textarea>
        </div>

        <div class="form-input">
            <label>Url de l'image du Dinosaure</label>
            <input formControlName="url">
        </div>

        <div class="form-input">
            <label>Code du Dinosaure</label>
            <input formControlName="code">
        </div>

        <button type="button" (click)="postDinosaure()"> Créer le dinosaure 🦖</button>
    </form>
</div>
