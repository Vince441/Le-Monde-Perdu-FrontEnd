<div class="main">
    <div class="container-form">
        @if(!isActive){
        <form [formGroup]="form">

            <h1>INSCRIPTION</h1>

            <div class="container-input-connexion">
                <div class="form-input">
                    <input placeholder="" type="email" formControlName="email">
                    <label>
                        Email
                    </label>
                </div>
                <div class="form-input absolute">
                    <input placeholder="" type="password" formControlName="password">
                    <label>Password</label>
                </div>
            </div>


            <div class="container-btn">
                <ul class="list-btn">
                    <li>
                        <button class="btn" (click)="enregistrerUser()">
                            S'inscrire
                        </button>
                    </li>
                </ul>
            </div>

        </form>
        } @else{
        <form [formGroup]="form" [class.active]="isActive">

            <h1>CONNEXION</h1>

            <div class="container-input-connexion">
                <div class="form-input">

                    <input placeholder="" type="email" formControlName="email">
                    <label>
                        Email
                    </label>
                </div>
                <div class="form-input">

                    <input placeholder="" type="text" formControlName="password">
                    <label>Password</label>
                </div>
            </div>


            <div class="container-btn">
                <ul class="list-btn">
                    <li>
                        <button class="btn" (click)="connexion()">
                            Se connecter
                        </button>
                    </li>
                </ul>
            </div>

        </form>

        }

        @if(!isActive){
        <div class="connexion-wrapper">
            <button class="connexion" (click)="itIsActive()">
                <h1>CONNEXION</h1>
            </button>
        </div>
        }@else{
        <div class="connexion-wrapper" [class.active]="isActive">
            <button class="connexion" (click)="itIsActive()">
                <h1>INSCRIPTION</h1>
            </button>
        </div>
        }
    </div>
</div>
